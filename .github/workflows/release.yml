name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  draft:
    name: Create release draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out signing script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Download verified packages from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: packages

      - name: Download Windows updater
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.updater-artifact-name }}
          path: packages

      - name: Download untested macOS and Linux builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: asterveil-updater-*-${{ github.sha }}-${{ github.run_attempt }}
          merge-multiple: true
          path: packages

      - name: Verify downloaded checksums
        working-directory: packages
        run: sha256sum --check SHA256SUMS.txt

      - name: Sign update manifest
        env:
          ASTERVEIL_UPDATE_PRIVATE_KEY: ${{ secrets.ASTERVEIL_UPDATE_PRIVATE_KEY }}
        run: node updater/scripts/release.mjs sign packages

      - name: Bundle extensions with the Windows updater and verify checksums
        run: python3 .github/scripts/bundle-updater.py packages

      - name: Create or refresh unpublished draft
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(./Asterveil-*-chrome.zip ./Asterveil-*-chrome-with-updater.zip
                  ./update-manifest.json ./update-manifest.sig ./SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw new Error("Refusing to replace a published release")'
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq 'Asterveil-Updater-windows-x64.zip'; then
              gh release delete-asset "$RELEASE_TAG" 'Asterveil-Updater-windows-x64.zip' --yes
            fi
            for prefix in Asterveil Asterveil-Pro; do
              old="$prefix-${RELEASE_TAG#v}-chrome-with-updater-windows-x64.zip"
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$old"; then
                gh release delete-asset "$RELEASE_TAG" "$old" --yes
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft --generate-notes \
              --title "Asterveil $RELEASE_TAG" "${assets[@]}"
          fi
