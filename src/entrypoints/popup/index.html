<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
  </head>
  <body>
    <main class="submitter">
      <header>
        <span class="logo" aria-hidden="true"></span>
        <h1>7FA4 Submitter</h1>
      </header>
      <div class="actions">
        <button type="button" id="send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7 18-4-7-7-4 18-7Z"/><path d="m10 14 5-5"/></svg>
          <span>发送提交</span>
        </button>
        <button type="button" id="send-vjudge" class="secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>
          <span>发送提交 · vjudge 题号</span>
        </button>
        <button type="button" id="login" class="ghost">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>
          <span>更新 7FA4 登录信息</span>
        </button>
      </div>
      <p id="feedback" role="status" hidden></p>
      <footer>
        <p id="login-status" role="status">正在检查登录状态…</p>
        <span id="submitter-version"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
