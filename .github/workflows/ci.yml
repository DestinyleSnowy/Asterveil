name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to validate before building a release
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: Verified extension packages and SHA-256 checksums
        value: ${{ jobs.build.outputs.artifact-name }}
      updater-artifact-name:
        description: Windows updater package
        value: ${{ jobs.updater.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  updater-unix:
    name: Build ${{ matrix.platform }} (not runtime tested)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore reusable updater package
        id: updater-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .output/Asterveil-Updater-${{ matrix.platform }}.zip
          key: updater-package-v1-${{ matrix.platform }}-${{ hashFiles('updater/**', '.cargo/**', 'LICENSE', '.github/workflows/ci.yml') }}
      - name: Set up Node.js
        if: steps.updater-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Set up Rust
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Compile only (no platform runtime tests)
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: cargo +1.96.0 build --release --locked --manifest-path updater/Cargo.toml
      - name: Package untested platform
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: python3 updater/scripts/package-unix.py "${{ matrix.platform }}"
      - name: Upload platform build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asterveil-updater-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .output/Asterveil-Updater-${{ matrix.platform }}.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
  updater:
    name: Windows updater
    runs-on: windows-2025
    timeout-minutes: 25
    concurrency:
      group: updater-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type == 'branch' }}
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore reusable updater package
        id: updater-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .output/Asterveil-Updater-windows-x64.zip
          key: updater-package-v1-windows-x64-${{ hashFiles('updater/**', '.cargo/**', 'LICENSE', '.github/workflows/ci.yml') }}
      - name: Extract reused updater for extension integration
        if: steps.updater-cache.outputs.cache-hit == 'true'
        run: Expand-Archive -LiteralPath .output/Asterveil-Updater-windows-x64.zip -DestinationPath updater/target/release -Force
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Set up Rust
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - name: Check Rust formatting
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: cargo +1.96.0 fmt --manifest-path updater/Cargo.toml --check
      - name: Check Rust code
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: cargo +1.96.0 clippy --locked --manifest-path updater/Cargo.toml --all-targets -- -D warnings
      - name: Test updater
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: cargo +1.96.0 test --locked --manifest-path updater/Cargo.toml
      - name: Build updater
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: cargo +1.96.0 build --release --locked --manifest-path updater/Cargo.toml
      - name: Install extension dependencies
        run: npm ci
      - name: Build extensions for browser integration
        run: npm run build:all
      - name: Install test browser
        run: npx playwright install chromium
      - name: Verify native messaging, reload, storage and recovery
        run: npm run test:updater:browser
      - name: Package updater
        if: steps.updater-cache.outputs.cache-hit != 'true'
        run: ./updater/scripts/package.ps1
      - name: Set artifact name
        id: metadata
        run: '"artifact-name=asterveil-updater-$env:GITHUB_SHA-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'
      - name: Upload updater
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: .output/Asterveil-Updater-windows-x64.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  build:
    name: Check, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type == 'branch' }}
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { RELEASE_TAG } = process.env;
          assert.match(RELEASE_TAG, /^v\d+\.\d+\.\d+$/, 'Use a stable version tag such as v0.1.1');
          assert.equal(RELEASE_TAG, `v${version}`, 'Tag must match package.json version');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting and types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build and package both editions
        run: npm run zip:all

      - name: Verify packages and generate checksums
        run: python3 .github/scripts/verify-packages.py

      - name: Set artifact name
        id: metadata
        run: echo "artifact-name=asterveil-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            .output/Asterveil-*-chrome.zip
            .output/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
