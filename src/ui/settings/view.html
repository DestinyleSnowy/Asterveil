<main class="settings-view" data-section="appearance">
  <form id="settings-form">
    <fieldset id="controls" disabled>
      <legend class="visually-hidden">扩展设置</legend>
      <div id="modules"></div>
      <section class="home-layout-settings" aria-label="首页布局">
        <label class="row settings-card">
          <strong>自定义首页</strong>
          <input id="home-layout-enabled" type="checkbox" role="switch" aria-checked="false" />
        </label>
        <fieldset id="home-layout-controls">
          <div class="home-layout-heading">
            <p>勾选要显示的板块，拖动或用箭头排序，也可调整所在栏。更改自动保存；窄屏按左栏、右栏依次显示。</p>
            <button id="home-layout-reset" type="button">恢复默认</button>
          </div>
          <p class="home-layout-note">仅调整首页已有板块；当前账号没有的板块不会新增。</p>
          <section class="settings-card home-column" aria-labelledby="home-main-title">
            <h2 id="home-main-title">左栏</h2>
            <ol data-home-column="main" aria-label="左栏板块"></ol>
          </section>
          <section class="settings-card home-column" aria-labelledby="home-side-title">
            <h2 id="home-side-title">右栏</h2>
            <ol data-home-column="side" aria-label="右栏板块"></ol>
          </section>
        </fieldset>
      </section>
      <fieldset id="color-mode" class="color-mode settings-card" aria-labelledby="color-mode-title">
        <h2 id="color-mode-title">显示模式</h2>
        <div class="mode-options">
          <label><input type="radio" name="color-mode" value="light" /><span><i data-settings-icon="sun"></i>浅色</span></label>
          <label><input type="radio" name="color-mode" value="dark" /><span><i data-settings-icon="moon"></i>深色</span></label>
          <label><input type="radio" name="color-mode" value="system" /><span><i data-settings-icon="monitor"></i>跟随系统</span></label>
        </div>
      </fieldset>
      <fieldset id="palette" class="palette settings-card" aria-labelledby="palette-title">
        <h2 id="palette-title">主题配色</h2>
        <div id="accent-presets" class="swatches">
          <label class="swatch custom-swatch">
            <input id="accent-color" type="color" value="#3b82c4" aria-label="自定义配色" />
            <i class="custom-chip" data-settings-icon="pipette"></i>
            <span>自定义</span>
          </label>
        </div>
      </fieldset>
      <section class="about" aria-label="关于 {{productName}}">
        <div class="settings-card about-info">
        <div class="about-product"><span class="emblem" aria-hidden="true"></span><h2>{{productName}}</h2></div>
        <dl class="about-details">
          <div><dt>版本</dt><dd id="version"></dd></div>
          <div><dt>作者</dt><dd>鱼oe不缺氧</dd></div>
          <div><dt>开源许可</dt><dd><a href="https://github.com/DestinyleSnowy/Asterveil/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">Apache-2.0</a></dd></div>
          <div><dt>项目地址</dt><dd><a href="https://github.com/DestinyleSnowy/Asterveil" target="_blank" rel="noopener noreferrer">GitHub</a></dd></div>
        </dl>
        </div>
        <label class="master row settings-card">
          <strong>启用 {{productName}}</strong>
          <input type="checkbox" id="enabled" role="switch" aria-checked="false" />
        </label>
        <p class="copyright">Copyright &copy; 2026 鱼oe不缺氧. All rights reserved.</p>
      </section>
    </fieldset>
  </form>
  <p id="status" role="status" aria-live="polite">正在读取设置…</p>
  <button id="retry" type="button" hidden>重新读取</button>
</main>
