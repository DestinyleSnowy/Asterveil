<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asterveil</title>
  </head>
  <body>
    <main>
      <header>
        <span class="emblem" aria-hidden="true">✦</span>
        <div><p class="eyebrow">A QUIETER WEB</p><h1>Asterveil</h1></div>
        <span class="version" id="version"></span>
      </header>
      <p class="intro">让熟悉的页面，更顺手一点。</p>
      <form id="settings-form">
        <fieldset id="controls" disabled>
          <legend class="visually-hidden">扩展设置</legend>
          <label class="master row">
            <span><strong>启用 Asterveil</strong><small>两个网站入口共用此设置</small></span>
            <input type="checkbox" id="enabled" role="switch" aria-checked="false" />
          </label>
          <div class="section-heading"><h2>功能模块</h2><span>按需开启</span></div>
          <div id="modules"></div>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite">正在读取设置…</p>
      <button id="retry" type="button" hidden>重新读取</button>
      <footer><span class="local-dot" aria-hidden="true"></span>设置仅保存在此浏览器<span>7FA4 · 双入口</span></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
